<!DOCTYPE html>
<html>
<head>
    <title>Skill Icon Picker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h2>Add Skill</h2>

<input 
    id="skillName"
    placeholder="Skill name"
>


<input 
    id="searchIcon"
    placeholder="Search icon..."
>


<div id="iconContainer"></div>


<input 
    id="selectedIcon"
    type="hidden"
>


<button onclick="saveSkill()">
    Save Skill
</button>


<script src="script.js"></script>

</body>
</html>
