<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio Settings</title>

<link rel="stylesheet" href="setting.css">

</head>


<body>


<header>

<h2>
Portfolio Settings
</h2>

<a href="main.html">
Back To Portfolio
</a>

</header>




<main>

<section class="container">


<h1>
Manage Portfolio
</h1>



<!-- ================= PROFILE ================= -->

<div class="card">


<h2>
Profile Information
</h2>


<form id="profileForm">


<label>
Name
</label>

<input 
type="text"
id="name"
placeholder="Your name">



<label>
Title
</label>

<input 
type="text"
id="title"
placeholder="MERN Stack Programmer">



<label>
Bio
</label>

<textarea
id="bio"
placeholder="Write your bio">
</textarea>




<label>
Profile Image
</label>

<input 
type="text"
id="profileImage"
placeholder="ibo.jpg">



<label>
Problems Solved
</label>

<input 
type="number"
id="problemsSolved"
placeholder="800">



<label>
University
</label>

<input 
type="text"
id="university"
placeholder="Adama Science and Technology University">



<label>
Email
</label>

<input 
type="email"
id="email"
placeholder="example@gmail.com">



<h3>
Social Links
</h3>


<input
type="text"
id="github"
placeholder="Github URL">



<input
type="text"
id="linkedin"
placeholder="LinkedIn URL">



<input
type="text"
id="codeforces"
placeholder="Codeforces URL">



<input
type="text"
id="leetcode"
placeholder="LeetCode URL">





<button type="submit">
Update Profile
</button>


</form>


</div>






<!-- ================= SKILLS ================= -->

<div class="card">


<h2>
Skills
</h2>


<form id="skillForm">


<label>
Skill Name
</label>

<input
type="text"
id="skillName"
placeholder="React">



<label>
Choose Icon
</label>

<input
type="text"
id="iconSearch"
placeholder="Search icon...">


<div id="iconPicker">

</div>


<input
type="hidden"
id="skillIcon">



<label >
Category
</label>

<select id="skillCategory" class = "card">

<option value="Programming">
Programming
</option>

<option value="Frontend">
Frontend
</option>

<option value="Backend">
Backend
</option>

<option value="Mobile">
Mobile
</option>

<option value="Database">
Database
</option>

<option value="Tools">
Tools
</option>

</select>



<label>
Level
</label>


<select id="skillLevel" class = "card">

<option class = "card">
Beginner
</option>

<option selected class = "card">
Intermediate
</option>

<option class = "card">
Advanced
</option>

<option class = "card">
Expert
</option>

</select>



<button type="submit">
Add Skill
</button>


</form>


<div id="skillList">

</div>


</div>






<!-- ================= PROJECTS ================= -->

<div class="card">


<h2>
Projects
</h2>



<form id="projectForm">


<label>
Project Name
</label>

<input
type="text"
id="projectName"
placeholder="Code Track">



<label>
Project Image
</label>

<input
type="text"
id="projectImage"
placeholder="codetrack.png">



<label>
Description
</label>

<textarea
id="projectDescription"
placeholder="Project description">
</textarea>




<label>
Technologies
</label>

<input
type="text"
id="projectTechnologies"
placeholder="React, Node.js, MongoDB">



<label>
Live Link
</label>

<input
type="text"
id="projectLive"
placeholder="https://example.com">



<label>
Github Link
</label>

<input
type="text"
id="projectGithub"
placeholder="https://github.com/project">





<label>

<input
type="checkbox"
id="featured">

Featured Project

</label>




<button type="submit">
Add Project
</button>



</form>



<div id="projectList">

</div>


</div>






</section>


</main>




<script src="setting.js"></script>


</body>

</html>
